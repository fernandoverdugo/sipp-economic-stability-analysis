name: baseline-models

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/predictors.json"
      - "src/build_features.py"
      - "src/train_baselines.py"
      - "requirements.txt"
      - "tests/test_baseline_models.py"
      - ".github/workflows/baseline-models.yml"

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Download full registered assets
        run: python src/download_assets.py --mode all

      - name: Build longitudinal panel
        run: python src/build_panel.py

      - name: Build baseline feature matrix
        run: python src/build_features.py

      - name: Train baseline models
        run: |
          set -o pipefail
          python src/train_baselines.py | tee baseline_models.log

      - name: Validate baseline model output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("data/metadata/baseline_models.json").read_text()
          )

          assert result["contract_version"] == "0.3"
          assert result["split_method"] == "GroupShuffleSplit by SSUID"

          for task in ("poverty_entry", "poverty_exit"):
              details = result["tasks"][task]
              assert details["split"]["household_overlap"] == 0
              assert details["sample"]["positive"] > 0

              baseline = details["prevalence_baseline"]["metrics"]
              logistic = details["regularized_logistic"]["metrics"]

              assert 0 <= baseline["roc_auc"] <= 1
              assert 0 <= logistic["roc_auc"] <= 1
              assert 0 <= logistic["average_precision"] <= 1
              assert logistic["brier_score"] >= 0
              assert logistic["log_loss"] >= 0
          PY

      - name: Upload model artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sipp-baseline-models
          path: |
            data/metadata/baseline_models.json
            baseline_models.log
