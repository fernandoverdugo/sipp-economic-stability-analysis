name: inspect-longitudinal-weight-format

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-longitudinal-weight-format.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect two-year longitudinal weight file
        run: |
          curl -L --fail --silent --show-error \
            https://www2.census.gov/programs-surveys/sipp/data/datasets/2025/lgtwgt2025yr2_csv.zip \
            -o weight.zip
          echo "ZIP MEMBERS"
          unzip -l weight.zip
          echo "FIRST THREE LINES"
          unzip -p weight.zip | head -n 3 | cat -vet
