name: model-validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/predictors.json"
      - "src/build_features.py"
      - "src/train_baselines.py"
      - "src/validate_models.py"
      - "requirements.txt"
      - "tests/test_model_validation.py"
      - ".github/workflows/model-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Download full registered assets
        run: python src/download_assets.py --mode all

      - name: Build longitudinal panel
        run: python src/build_panel.py

      - name: Build baseline feature matrix
        run: python src/build_features.py

      - name: Run repeated weighted validation
        run: |
          set -o pipefail
          python src/validate_models.py | tee model_validation.log

      - name: Validate model validation output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("data/metadata/model_validation.json").read_text()
          )

          assert result["contract_version"] == "0.3"
          assert result["evaluation"]["repeats"] == 10
          assert result["evaluation"]["weighted_model_fit"]

          for task in ("poverty_entry", "poverty_exit"):
              details = result["tasks"][task]
              assert details["repeats"] == 10

              for weighting in ("unweighted", "weighted"):
                  metrics = details["metrics"][weighting]
                  assert 0 <= metrics["roc_auc"]["mean"] <= 1
                  assert 0 <= metrics["average_precision"]["mean"] <= 1
                  assert metrics["brier_score"]["mean"] >= 0
                  assert metrics["log_loss"]["mean"] >= 0

              assert len(
                  details["representative_holdout"]["unweighted_bins"]
              ) == 10
              assert len(
                  details["representative_holdout"]["weighted_bins"]
              ) == 10
          PY

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sipp-model-validation
          path: |
            data/metadata/model_validation.json
            model_validation.log
