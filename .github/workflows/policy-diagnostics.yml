name: policy-diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/predictors.json"
      - "src/build_features.py"
      - "src/train_baselines.py"
      - "src/validate_models.py"
      - "src/policy_diagnostics.py"
      - "requirements.txt"
      - "tests/test_policy_diagnostics.py"
      - ".github/workflows/policy-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Download full registered assets
        run: python src/download_assets.py --mode all

      - name: Build longitudinal panel
        run: python src/build_panel.py

      - name: Build baseline feature matrix
        run: python src/build_features.py

      - name: Run policy diagnostics
        run: |
          set -o pipefail
          python src/policy_diagnostics.py | tee policy_diagnostics.log

      - name: Validate policy diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("data/metadata/policy_diagnostics.json").read_text()
          )

          assert result["contract_version"] == "0.3"

          for task in ("poverty_entry", "poverty_exit"):
              details = result["tasks"][task]
              assert details["holdout"]["rows"] > 0
              assert details["holdout"]["positive"] > 0

              for key in ("top_5pct", "top_10pct", "top_20pct"):
                  item = details["risk_concentration"][key]
                  assert 0 <= item["positive_capture_rate"] <= 1
                  assert 0 <= item["weighted_positive_capture_rate"] <= 1

              assert "sex" in details["subgroups"]
              assert "race" in details["subgroups"]
              assert "age_band" in details["subgroups"]
          PY

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sipp-policy-diagnostics
          path: |
            data/metadata/policy_diagnostics.json
            policy_diagnostics.log
