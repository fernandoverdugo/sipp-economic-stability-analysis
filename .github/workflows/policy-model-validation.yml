name: policy-model-validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/policy_model.json"
      - "config/predictors.json"
      - "src/build_features.py"
      - "src/train_baselines.py"
      - "src/validate_models.py"
      - "src/validate_policy_model.py"
      - "src/audit_policy_model.py"
      - "requirements.txt"
      - "tests/test_policy_model.py"
      - ".github/workflows/policy-model-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Download full registered assets
        run: python src/download_assets.py --mode all

      - name: Build longitudinal panel
        run: python src/build_panel.py

      - name: Build baseline feature matrix
        run: python src/build_features.py

      - name: Validate lean policy model
        run: |
          set -o pipefail
          python src/validate_policy_model.py | tee policy_model_validation.log

      - name: Audit lean policy model
        run: |
          set -o pipefail
          python src/audit_policy_model.py | tee policy_model_subgroups.log

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          validation = json.loads(
              Path("data/metadata/policy_model_validation.json").read_text()
          )
          audit = json.loads(
              Path("data/metadata/policy_model_subgroups.json").read_text()
          )

          assert validation["policy_model_version"] == "1.0"
          assert validation["feature_count"] == 10
          assert set(validation["features"]) == {
              "education",
              "months_employed",
              "months_unemployed",
              "mean_weekly_hours",
              "annual_person_earnings",
              "annual_person_income",
              "baseline_poverty_ratio",
              "housing_tenure",
              "housing_assistance_status",
              "snap_received_year",
          }

          for task in ("poverty_entry", "poverty_exit"):
              details = validation["tasks"][task]
              assert details["repeats"] == 10
              assert 0 <= details["metrics"]["weighted"]["roc_auc"]["mean"] <= 1
              assert 0 <= details["metrics"]["weighted"]["average_precision"]["mean"] <= 1

              assert task in audit["tasks"]
              assert "age_band" in audit["tasks"][task]["subgroups"]
              assert "sex" in audit["tasks"][task]["subgroups"]
          PY

      - name: Upload policy model artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sipp-policy-model-validation
          path: |
            data/metadata/policy_model_validation.json
            data/metadata/policy_model_subgroups.json
            policy_model_validation.log
            policy_model_subgroups.log
